<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frostfall Stronghold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div class="vignette"></div>

      <header class="top">
        <div class="brand">RISEN <span>Stronghold mockup</span></div>
        <p class="sub">Three wall styles and three nexus styles. Mix any pair.</p>
      </header>

      <div class="bottom">
        <div class="pickers">
          <div class="picker" role="group" aria-label="Walls">
            <span class="plabel">Walls</span>
            <button id="wA" class="chip" aria-pressed="true"><b>A</b> Armored deck</button>
            <button id="wB" class="chip" aria-pressed="false"><b>B</b> Bunker</button>
            <button id="wC" class="chip" aria-pressed="false"><b>C</b> Prefab frame</button>
          </div>
          <div class="picker" role="group" aria-label="Nexus">
            <span class="plabel">Nexus</span>
            <button id="nA" class="chip" aria-pressed="true"><b>A</b> Reactor core</button>
            <button id="nB" class="chip" aria-pressed="false"><b>B</b> Spire</button>
            <button id="nC" class="chip" aria-pressed="false"><b>C</b> Shield dome</button>
          </div>
        </div>
        <p id="note" class="note"></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
