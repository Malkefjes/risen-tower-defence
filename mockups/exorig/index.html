<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frostfall Exo-rigs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div class="vignette"></div>
      <div id="labels"></div>
      <header class="top">
        <div class="brand">RISEN <span>Exo-rig mockup</span></div>
        <p class="sub">Three piloted rigs for your avatar, each running the early loop: walk to a node, mine, carry the ore back to the Rocket.</p>
      </header>
      <div class="bottom">
        <div class="picker" role="group" aria-label="Follow a design">
          <button id="fAll" class="chip" aria-pressed="true">All three</button>
          <button id="fA" class="chip" aria-pressed="false"><b>A</b> Strider</button>
          <button id="fB" class="chip" aria-pressed="false"><b>B</b> Loader</button>
          <button id="fC" class="chip" aria-pressed="false"><b>C</b> Crab</button>
        </div>
        <p id="note" class="note"></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
