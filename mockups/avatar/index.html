<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frostfall Avatar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #6c6b98; font-family: Inter, system-ui, sans-serif; color: #eef0f6; }
      #view { position: fixed; inset: 0; }
      .bar { position: absolute; left: 16px; top: 16px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
      .bar button, .bar label { background: rgba(14,16,28,.46); border: 1px solid rgba(255,255,255,.12); color: #a3a8bb; padding: 7px 12px; font: 600 11px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(12px); }
      .bar button[aria-pressed="true"] { background: rgba(255,255,255,.10); color: #fff; box-shadow: inset 2px 0 0 #ff7a2f; }
      .bar label { display: flex; gap: 8px; align-items: center; cursor: default; }
      .bar input { accent-color: #ff7a2f; width: 110px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div class="bar" id="bar"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
