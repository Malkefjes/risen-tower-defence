<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frostfall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" />
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div class="vignette"></div>

      <header class="topbar">
        <div class="brand">FROSTFALL</div>
        <div class="status">
          <span id="round">Round 1</span>
          <span id="phase" class="pill">Planning</span>
          <span id="hp" class="stat hp" title="Ship HP"></span>
        </div>
        <div class="tools">
          <button id="bPath" class="tool" aria-pressed="true" title="Path preview (V)">Path</button>
          <button id="bGrid" class="tool" aria-pressed="false" title="Grid (G)">Grid</button>
          <button id="bWalkers" class="tool" aria-pressed="false" title="Test walkers during planning (T)">Test walkers</button>
          <button id="bSpeed" class="tool" title="Game speed (F)">1×</button>
          <button id="bPause" class="tool" aria-pressed="false" title="Pause (P)">Pause</button>
          <button id="bTune" class="tool" aria-pressed="false" title="Tuning panel (K)">Tune</button>
        </div>
      </header>

      <div id="toast" role="status" aria-live="polite"></div>
      <div id="gain" class="gain"></div>

      <div id="paused" class="paused" hidden aria-live="polite">
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
        <b>Paused</b>
      </div>

      <div id="over" class="over" hidden>
        <span id="overText">The nexus fell.</span>
        <button id="restartBtn" class="primary small">New run</button>
      </div>

      <aside id="tune" class="tune" hidden aria-label="Tuning"></aside>

      <div class="bottom">
        <div class="inspect" id="inspect" hidden></div>
        <div class="center">
          <div class="smelter" id="smelter" hidden aria-label="Smelter"></div>
          <div class="hotbar" id="hotbar" aria-label="Hotbar"></div>
        </div>
        <div class="actions">
          <button id="waveBtn" class="primary">Start wave</button>
        </div>
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
